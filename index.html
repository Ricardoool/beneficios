<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Beneficios tarjetas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F2;
    --ink:#241F1B;
    --ink-soft:#6B6255;
    --card:#FFFFFF;
    --line:#E7E2D8;
    --gnb:#5C7A34;
    --gnb-pale:#E4EAD5;
    --itau:#EC7000;
    --itau-pale:#FCE6D2;
    --navy:#1B2A41;
    --navy-pale:#E4E9F0;
    --accent:#B85400;
    --today-ring:#241F1B;
    --star:#C98A2B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;padding:16px 14px 90px;}

  .top{margin-bottom:14px;}
  .top h1{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:0 0 3px;
  }
  .top p{
    margin:0 0 8px;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.4;
  }
  .today-chip{
    display:inline-block;
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    background:var(--navy);
    color:#F1F4F9;
    padding:5px 10px;
    border-radius:6px;
  }

  /* favorites-today section */
  .focus{
    background:linear-gradient(180deg,#FFF9EE,#FFFDF9);
    border:1px solid #ECD9AE;
    border-radius:14px;
    padding:13px 14px;
    margin-bottom:16px;
  }
  .focus-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  .focus-head h2{
    margin:0; font-size:14.5px; font-weight:700;
    display:flex; align-items:center; gap:5px;
  }
  .focus-head .count{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-soft);
  }
  .focus-empty{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .focus-list{display:flex; flex-direction:column; gap:7px;}
  .focus-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px;
  }
  .focus-item .fi-name{font-size:13.5px; font-weight:700;}
  .focus-item .fi-desc{font-size:11.5px; color:var(--ink-soft); margin-top:2px; line-height:1.35;}
  .focus-item .fi-badges{display:flex; gap:4px; flex-shrink:0;}
  .focus-none-today{
    font-size:12px; color:#9C927F; font-style:italic;
  }

  /* week strip */
  .week-wrap{
    margin-bottom:12px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .week-wrap::-webkit-scrollbar{display:none;}
  .week{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:minmax(58px,1fr);
    gap:7px;
  }
  .day-cell{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 4px 8px;
    text-align:center;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    min-height:56px;
  }
  .day-cell.active{background:var(--ink); border-color:var(--ink);}
  .day-cell.active .dname, .day-cell.active .dcount{color:#F5F3EE;}
  .day-cell.is-today{box-shadow:inset 0 0 0 2px var(--today-ring);}
  .day-cell.active.is-today{box-shadow:none;}
  .dname{
    display:block; font-size:10.5px; font-weight:600;
    color:var(--ink-soft); text-transform:capitalize; margin-bottom:4px;
  }
  .dcount{
    display:block; font-size:17px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  /* search */
  .search{margin-bottom:10px;}
  .search input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:inherit;
    font-size:15px;
    background:var(--card);
    color:var(--ink);
    -webkit-appearance:none;
  }
  .search input:focus{outline:2px solid var(--ink); outline-offset:1px;}
  .search input::placeholder{color:#AFA695;}

  .chip-rail{
    display:flex; gap:7px; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; padding-bottom:2px; margin-bottom:8px;
  }
  .chip-rail::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    padding:9px 13px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    min-height:36px;
    display:flex; align-items:center; gap:4px;
  }
  .chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .chip .n{opacity:.75; font-weight:500;}
  .chip.bank-gnb.active{background:var(--gnb); border-color:var(--gnb);}
  .chip.bank-itau.active{background:var(--itau); border-color:var(--itau);}
  .chip.fav.active{background:var(--star); border-color:var(--star);}

  .meta-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:10px; font-size:12.5px; color:var(--ink-soft);
  }
  .meta-row button{
    background:none; border:none; color:var(--accent);
    font-size:12.5px; font-weight:600; cursor:pointer; padding:6px 0;
    text-decoration:underline; font-family:inherit;
  }

  .grid{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
  }
  .card.expiring{border-color:#B03A2E;}
  .card.is-fav{border-color:var(--star);}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .name-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .card h3{margin:0; font-size:15.5px; font-weight:700; letter-spacing:-0.01em; line-height:1.25;}
  .bank-tag{
    font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:5px;
    text-transform:uppercase; letter-spacing:.02em; flex-shrink:0;
  }
  .bank-tag.gnb{background:var(--gnb-pale); color:#3F5622;}
  .bank-tag.itau{background:var(--itau-pale); color:#B85400;}
  .star-btn{
    flex-shrink:0;
    background:none; border:none; cursor:pointer;
    font-size:22px; line-height:1; padding:2px 4px;
    color:#D9D2C3;
  }
  .star-btn.active{color:var(--star);}
  .badges{display:flex; gap:5px; flex-wrap:wrap;}
  .badge{
    font-family:'Space Mono',monospace; font-size:11px; font-weight:700;
    padding:3px 7px; border-radius:5px; white-space:nowrap;
  }
  .badge.off{background:var(--gnb-pale); color:#3F5622;}
  .badge.cuotas{background:var(--navy-pale); color:var(--navy);}
  .badge.itaupct{background:var(--itau-pale); color:#B85400;}
  .card p.desc{margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.45;}
  .card-foot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:2px; padding-top:8px; border-top:1px solid var(--line);
    font-size:11.5px; color:#9C927F;
  }
  .days-tags{display:flex; gap:4px; flex-wrap:wrap;}
  .day-tag{
    font-size:10px; font-weight:600; color:#3F5622;
    background:var(--gnb-pale); padding:2px 5px; border-radius:4px;
  }
  .day-tag.special{
    color:#8A5A12; background:#FBEBCB;
  }
  .expiry{font-family:'Space Mono',monospace; flex-shrink:0; margin-left:8px;}
  .expiry.soon{color:#B03A2E; font-weight:700;}

  .empty{text-align:center; padding:50px 16px; color:var(--ink-soft); font-size:14px;}

  @media (min-width:600px){
    .week{grid-auto-columns:1fr; grid-auto-flow:row; grid-template-columns:repeat(7,1fr); display:grid;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>Beneficios de mis tarjetas</h1>
    <p>GNB e Itaú juntos, solo comercios con descuento real (se excluyeron los que son únicamente cuotas sin intereses). Tocá la ☆ para agregar a favoritos.</p>
    <span class="today-chip" id="todayChip"></span>
  </div>

  <div class="focus" id="focusSection">
    <div class="focus-head">
      <h2>⭐ Mis favoritos de hoy</h2>
      <span class="count" id="focusCount"></span>
    </div>
    <div id="focusBody"><span class="focus-empty">Cargando…</span></div>
  </div>

  <div class="week-wrap"><div class="week" id="week"></div></div>

  <div class="search">
    <input type="text" id="searchInput" placeholder="Buscar comercio…">
  </div>

  <div class="chip-rail" id="bankRail">
    <button class="chip active" data-bank="all">Todos <span class="n" id="cnt-all"></span></button>
    <button class="chip bank-gnb" data-bank="GNB">GNB <span class="n" id="cnt-gnb"></span></button>
    <button class="chip bank-itau" data-bank="Itau">Itaú <span class="n" id="cnt-itau"></span></button>
  </div>
  <div class="chip-rail" id="extraRail">
    <button class="chip fav" data-extra="fav">⭐ Favoritos <span class="n" id="cnt-fav-chip"></span></button>
    <button class="chip" data-extra="featured">Destacados <span class="n" id="cnt-feat"></span></button>
    <button class="chip" data-extra="expiring">Vencen pronto <span class="n" id="cnt-exp"></span></button>
  </div>

  <div class="meta-row">
    <span id="resultCount"></span>
    <button id="clearBtn" style="display:none;">Quitar filtros</button>
  </div>

  <div class="grid" id="cards"></div>
  <div class="empty" id="emptyState" style="display:none;">No hay beneficios que coincidan con ese filtro.</div>
</div>

const TODAY = new Date();
TODAY.setHours(0,0,0,0);

const DAY_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAY_RE = [/lunes/i,/martes/i,/mi[ée]rcoles/i,/jueves/i,/viernes/i,/s[áa]bado/i,/domingo/i];

function normDayWord(w){
  w = w.replace(/s$/,'');
  if(w.startsWith('mi')) return 2;
  if(w.startsWith('lu')) return 0;
  if(w.startsWith('ma')) return 1;
  if(w.startsWith('ju')) return 3;
  if(w.startsWith('vi')) return 4;
  if(w.startsWith('s')) return 5;
  if(w.startsWith('do')) return 6;
  return -1;
}

// Finds explicit weekday mentions (ranges + individual names) in a lowercased string.
// Does NOT special-case "todos los días" - callers decide how to use that phrase.
function scanExplicitDays(t){
  let days = new Set();
  const rangeMatch = t.match(/de (lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bados?|domingos?)\s+a\s+(lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bados?|domingos?)/);
  if(rangeMatch){
    let a = normDayWord(rangeMatch[1]), b = normDayWord(rangeMatch[2]);
    if(a>=0 && b>=0){
      let i=a;
      while(true){ days.add(i); if(i===b) break; i=(i+1)%7; }
    }
  }
  DAY_RE.forEach((re,i)=>{ if(re.test(t)) days.add(i); });
  return days;
}

function parseDays(desc){
  const tFull = desc.toLowerCase();
  const hasEveryDay = /todos los d[ií]as/.test(tFull);
  if(!hasEveryDay){
    return Array.from(scanExplicitDays(tFull)).sort((a,b)=>a-b);
  }
  // "todos los días" is present somewhere - it often qualifies only the cuotas
  // clause (e.g. "20% los miércoles + 12 cuotas sin intereses todos los días"),
  // not the discount itself. Split on '+' and drop whichever clause(s) contain
  // the "todos los días" phrase before scanning for an explicit weekday.
  const clauses = desc.split('+');
  const nonEveryClauses = clauses.filter(c => !/todos los d[ií]as/i.test(c));
  const specific = scanExplicitDays(nonEveryClauses.join(' ').toLowerCase());
  if(specific.size > 0){
    return Array.from(specific).sort((a,b)=>a-b);
  }
  // no other weekday mentioned anywhere - genuinely applies every day
  return [0,1,2,3,4,5,6];
}

function parseDate(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

const todayIdx = (TODAY.getDay()+6)%7;

// --- Non-weekly recurrence detection ---
// Some deals are NOT "every Monday" style: they're a single specific date
// ("el miércoles 9 de septiembre de 2026") or a monthly occurrence
// ("el último miércoles de cada mes", "tercera semana del mes"). Treating
// those as weekly-recurring is wrong, so they're classified separately and
// excluded from the weekly day-of-week grid.
const MONTHS_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ORDINAL_MAP = {'primer':1,'primero':1,'segundo':2,'tercer':3,'tercero':3,'cuarto':4,'último':'last','ultimo':'last'};
const WEEK_ORDINAL_MAP = {'primera':1,'segunda':2,'tercera':3,'cuarta':4,'última':'last','ultima':'last'};

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function nthWeekdayOfMonth(year, month, weekdayIdx, n){
  if(n==='last'){
    let d = new Date(year, month+1, 0);
    while(((d.getDay()+6)%7) !== weekdayIdx){ d.setDate(d.getDate()-1); }
    return d;
  }
  let d = new Date(year, month, 1);
  let count = 0;
  while(true){
    if(((d.getDay()+6)%7) === weekdayIdx){ count++; if(count===n) return d; }
    d.setDate(d.getDate()+1);
    if(d.getMonth()!==month) return null;
  }
}

function sameDate(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function classifyRecurrence(desc){
  const ordM = desc.match(/(primer|primero|segundo|tercer|tercero|cuarto|último|ultimo)\s+(lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bado|domingo)/i);
  if(ordM){
    const ord = ORDINAL_MAP[ordM[1].toLowerCase()];
    const wd = normDayWord(ordM[2].toLowerCase());
    const occ = nthWeekdayOfMonth(TODAY.getFullYear(), TODAY.getMonth(), wd, ord);
    return {
      type:'monthly',
      note: capitalize(ordM[0]) + ' de cada mes',
      activeToday: sameDate(occ, TODAY)
    };
  }
  const weekM = desc.match(/(primera|segunda|tercera|cuarta|última|ultima)\s+semana\s+del?\s+mes/i);
  if(weekM){
    const wds = Array.from(scanExplicitDays(desc.toLowerCase()));
    const ord = WEEK_ORDINAL_MAP[weekM[1].toLowerCase()];
    // week N = days [(N-1)*7+1 .. N*7] of the month (week "last" = final 7 days)
    let rangeStart, rangeEnd;
    const lastDom = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 0).getDate();
    if(ord==='last'){ rangeStart = lastDom-6; rangeEnd = lastDom; }
    else { rangeStart = (ord-1)*7+1; rangeEnd = ord*7; }
    const dom = TODAY.getDate();
    const inRange = dom>=rangeStart && dom<=rangeEnd;
    const todayMatchesWd = wds.includes(todayIdx);
    return {
      type:'monthly',
      note: capitalize(weekM[0]) + (wds.length? ' (' + wds.map(i=>DAY_SHORT[i]).join('/') + ')' : ''),
      activeToday: inRange && todayMatchesWd
    };
  }
  const dateM = desc.match(/(lunes|martes|mi[ée]rcoles|jueves|viernes|s[áa]bado|domingo)\s+(\d{1,2})\s+de\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)(?:\s+de[l]?\s+(\d{4}))?/i);
  if(dateM){
    const day = parseInt(dateM[2],10);
    const monthIdx = MONTHS_ES.indexOf(dateM[3].toLowerCase());
    const year = dateM[4] ? parseInt(dateM[4],10) : TODAY.getFullYear();
    const exactDate = new Date(year, monthIdx, day);
    return {
      type:'onetime',
      note: 'Fecha única: ' + capitalize(dateM[0]),
      activeToday: sameDate(exactDate, TODAY)
    };
  }
  return null;
}

const items = DATA.map((row,idx)=>{
  const [bank,n,badges,d,s,e,h] = row;
  const start = parseDate(s), end = parseDate(e);
  const special = classifyRecurrence(d);
  const days = special ? [] : parseDays(d);
  const inWindow = TODAY >= start && TODAY <= end;
  const daysLeft = Math.round((end - TODAY)/86400000);
  const isExpiring = inWindow && daysLeft <= 30 && daysLeft >= 0;
  const activeToday = special ? (inWindow && special.activeToday) : (inWindow && (days.length===0 || days.includes(todayIdx)));
  const id = bank + '::' + n;
  return {idx, id, bank, n, badges, d, start, end, days, special, h:!!h, inWindow, daysLeft, isExpiring, activeToday};
});

let favorites = new Set();
let favLoaded = false;
let state = { bank:'all', extra:null, day:null, query:'' };

function fmtDate(dt){ return dt.toLocaleDateString('es-PY',{day:'2-digit',month:'short'}); }

function badgeClass(bank, bd){
  if(bank==='Itau') return /cuota/i.test(bd) ? 'cuotas' : 'itaupct';
  return /cuota/i.test(bd) ? 'cuotas' : 'off';
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadFavorites(){
  try{
    const raw = localStorage.getItem('gnb-itau-favorite-merchants');
    if(raw){
      favorites = new Set(JSON.parse(raw));
    }
  }catch(e){
    favorites = new Set();
  }
  favLoaded = true;
}

async function saveFavorites(){
  try{
    localStorage.setItem('gnb-itau-favorite-merchants', JSON.stringify(Array.from(favorites)));
  }catch(e){ /* best effort - private browsing / storage disabled */ }
}

function toggleFavorite(id){
  if(favorites.has(id)) favorites.delete(id);
  else favorites.add(id);
  saveFavorites();
  render();
}

function renderFocus(){
  const favItems = items.filter(it=>favorites.has(it.id));
  const activeNow = favItems.filter(it=>it.activeToday);
  document.getElementById('focusCount').textContent = favorites.size ? `${activeNow.length} de ${favItems.length} hoy` : '';
  const body = document.getElementById('focusBody');
  if(favorites.size===0){
    body.innerHTML = '<span class="focus-empty">Todavía no tenés favoritos. Tocá la ☆ en cualquier comercio de la lista para que aparezca acá cuando tenga beneficio hoy.</span>';
    return;
  }
  if(activeNow.length===0){
    body.innerHTML = '<span class="focus-none-today">Ninguno de tus favoritos tiene beneficio hoy.</span>';
    return;
  }
  activeNow.sort((a,b)=>a.n.localeCompare(b.n,'es'));
  document.getElementById('focusBody').innerHTML = '<div class="focus-list">' + activeNow.map(it=>{
    const badgeHtml = it.badges.map(bd=>`<span class="badge ${badgeClass(it.bank,bd)}">${escapeHtml(bd)}</span>`).join('');
    return `<div class="focus-item">
      <div>
        <div class="fi-name">${escapeHtml(it.n)} <span class="bank-tag ${it.bank==='Itau'?'itau':'gnb'}">${it.bank==='Itau'?'Itaú':'GNB'}</span></div>
        <div class="fi-desc">${escapeHtml(it.d)}</div>
      </div>
      <div class="fi-badges">${badgeHtml}</div>
    </div>`;
  }).join('') + '</div>';
}

            <span class="bank-tag ${it.bank==='Itau'?'itau':'gnb'}">${it.bank==='Itau'?'Itaú':'GNB'}</span>
          </div>
          <button class="star-btn ${isFav?'active':''}" data-favid="${escapeHtml(it.id)}" aria-label="Favorito">${isFav?'★':'☆'}</button>
        </div>
        <div class="badges">${badgeHtml}</div>
        <p class="desc">${escapeHtml(it.d)}</p>
        <div class="card-foot">
          <div class="days-tags">${tags}</div>
          <span class="expiry ${it.isExpiring?'soon':''}">${expiryLabel}</span>
        </div>
      </div>`;
    }).join('');

    grid.querySelectorAll('.star-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ toggleFavorite(btn.dataset.favid); });
    });
  }

  document.getElementById('resultCount').textContent = `${filtered.length} de ${items.length} beneficios`;
  const anyFilter = state.bank!=='all' || state.extra!==null || state.day!==null || q!=='';
  document.getElementById('clearBtn').style.display = anyFilter ? 'inline' : 'none';

  document.querySelectorAll('.day-cell').forEach((cell,i)=>{
    const count = items.filter(it=>!it.special && it.inWindow && it.days.includes(i)).length;
    cell.querySelector('.dcount').textContent = count;
    cell.classList.toggle('active', state.day===i);
  });

  document.getElementById('cnt-all').textContent = items.length;
  document.getElementById('cnt-gnb').textContent = items.filter(it=>it.bank==='GNB').length;
  document.getElementById('cnt-itau').textContent = items.filter(it=>it.bank==='Itau').length;
  document.getElementById('cnt-feat').textContent = items.filter(it=>it.h).length;
  document.getElementById('cnt-exp').textContent = items.filter(it=>it.isExpiring).length;
  document.getElementById('cnt-fav-chip').textContent = favorites.size;

  document.querySelectorAll('#bankRail .chip').forEach(ch=>{
    ch.classList.toggle('active', ch.dataset.bank===state.bank);
  });
  document.querySelectorAll('#extraRail .chip').forEach(ch=>{
    ch.classList.toggle('active', ch.dataset.extra===state.extra);
  });

  renderFocus();
}

const weekEl = document.getElementById('week');
weekEl.innerHTML = DAY_SHORT.map((label,i)=>`
  <div class="day-cell ${i===todayIdx?'is-today':''}" data-day="${i}">
    <span class="dname">${label}</span>
    <span class="dcount">0</span>
  </div>`).join('');

weekEl.querySelectorAll('.day-cell').forEach(cell=>{
  cell.addEventListener('click', ()=>{
    const d = Number(cell.dataset.day);
    state.day = state.day===d ? null : d;
    render();
  });
});

document.querySelectorAll('#bankRail .chip').forEach(ch=>{
  ch.addEventListener('click', ()=>{ state.bank = ch.dataset.bank; render(); });
});
document.querySelectorAll('#extraRail .chip').forEach(ch=>{
  ch.addEventListener('click', ()=>{
    state.extra = state.extra===ch.dataset.extra ? null : ch.dataset.extra;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e=>{ state.query = e.target.value; render(); });

document.getElementById('clearBtn').addEventListener('click', ()=>{
  state = {bank:'all', extra:null, day:null, query:''};
  document.getElementById('searchInput').value='';
  render();
});

document.getElementById('todayChip').textContent = 'Hoy: ' + TODAY.toLocaleDateString('es-PY',{weekday:'long', day:'numeric', month:'long'});

(async function init(){
  await loadFavorites();
  render();
})();
</script>
</body>
</html>
